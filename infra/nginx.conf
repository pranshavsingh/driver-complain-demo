# ──────────────────────────────────────────────────────────────
# Nginx reverse proxy / load balancer for horizontal API scaling
# Phase 3: Deploy behind this config with multiple API instances.
# ──────────────────────────────────────────────────────────────

upstream api_cluster {
    # Round-robin by default. Use `least_conn` for better load distribution.
    least_conn;

    server api-1:4000;
    server api-2:4000;
    server api-3:4000;

    # Health check: mark server down after 3 failed attempts.
    # server api-1:4000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name api.drivercomplaint.example.com;

    # Redirect HTTP → HTTPS in production.
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://api_cluster;

        # Standard reverse-proxy headers.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — generous for file-upload endpoints.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Bump max body size for photo/video uploads.
        client_max_body_size 25m;
    }

    # Socket.IO requires WebSocket upgrade.
    location /socket.io/ {
        proxy_pass http://api_cluster;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep WebSocket connections alive longer.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check endpoint for load balancer probes.
    location /health {
        proxy_pass http://api_cluster;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Static assets via CDN — uncomment when CDN is configured.
    # location /static/ {
    #     proxy_pass https://cdn.drivercomplaint.example.com/;
    #     proxy_cache_valid 200 30d;
    #     add_header Cache-Control "public, max-age=2592000";
    # }
}
