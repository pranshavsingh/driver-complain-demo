# ──────────────────────────────────────────────────────────────
# Kubernetes deployment for the Driver Complaint API.
# Phase 4: Auto-scaling with horizontal pod autoscaler.
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: driver-complaint-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: driver-complaint-api
  template:
    metadata:
      labels:
        app: driver-complaint-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: driver-complaint/api:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '4000'
            - name: UV_THREADPOOL_SIZE
              value: '2'
            - name: REQUIRE_REDIS_READY
              value: 'true'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: redis-url
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: jwt-access-secret
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: refresh-token-secret
            - name: METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: metrics-auth-token
                  optional: true
          # Resource reservations tuned to match native bcrypt benchmark requirements:
          # - QoS Class: Guaranteed (requests == limits for both CPU and memory).
          #   NOTE: Guaranteed QoS prevents CFS share degradation and out-of-memory eviction,
          #   but does NOT imply exclusive physical CPU pinning (which requires node-level kubelet
          #   cpuManagerPolicy=static). Hyperthread contention and OS-level jitter remain possible.
          # - Sidecar Warning: If sidecar containers (e.g. Istio, Fluentbit) are added to this Pod,
          #   every sidecar must also specify matching CPU and memory requests and limits; otherwise,
          #   the Pod QoS class drops to Burstable.
          # - Sizing Decision: Configured at 2 CPU and 1 GiB only because infrastructure cost and
          #   node capacity have been explicitly accepted by operations.
          # - Infrastructure Cost & Capacity:
          #   * Baseline (3 replicas): 6.0 vCPUs, 3 GiB RAM (~$180-$220/mo on cloud compute).
          #   * Peak (10 replicas via HPA): 20.0 vCPUs, 10 GiB RAM.
          #   * HPA Scaling: target averageUtilization=70% corresponds to ~1.4 CPU per Pod.
          #   * Node Capacity: Nodes must have >= 4 vCPUs (e.g., c6i.xlarge hosting 1-2 pods
          #     or c6i.2xlarge hosting 3 pods alongside daemonsets).
          resources:
            requests:
              cpu: '2'
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: driver-complaint-api
  ports:
    - name: http
      port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
