# ──────────────────────────────────────────────────────────────
# PgBouncer — connection pooler for PostgreSQL.
# Phase 2+: Place between Prisma and PostgreSQL to handle connection
# pooling efficiently under high concurrency.
# ──────────────────────────────────────────────────────────────

[databases]
driver_complaint = host=postgres port=5432 dbname=driver_complaint

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# Pool mode: transaction — connections are returned to pool at txn boundary.
# This is the safest mode for Prisma and allows many clients to share few
# backend connections.
pool_mode = transaction

# Pool sizing — adjust based on load.
# default_pool_size × number_of_databases ≤ PostgreSQL max_connections.
default_pool_size = 30
min_pool_size = 5
max_client_conn = 200
reserve_pool_size = 5
reserve_pool_timeout = 5

# Timeouts.
server_connect_timeout = 15
server_idle_timeout = 600
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

# Auth — use auth_file or auth_hba_file in production.
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Logging.
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

# Stats — expose for monitoring.
stats_period = 60
