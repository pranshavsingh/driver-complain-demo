# ──────────────────────────────────────────────────────────────
# Docker Compose — optional local Redis only. PostgreSQL is supplied through DATABASE_URL.
# Usage: docker compose up -d
# ──────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redisdata:
